<div id="log" class="sl__chat__layout" aria-label="Twitch 聊天訊息"></div>
<script type="text/template" id="chatlist_item">
  <div class="chat-message" data-from="{from}" data-id="{messageId}">
    <div class="chat-name"><span class="badges"></span><span class="name" style="color: {color}">{from}</span></div>
    <div class="chat-text">{message}</div>
  </div>
</script>
